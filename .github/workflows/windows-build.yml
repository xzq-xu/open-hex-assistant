name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package version
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $version = node -p "require('./package.json').version"
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match package.json version v$version"
          }

      - name: Build portable Windows package
        run: npm run pack:win

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $asset = Get-ChildItem -Path release -Filter "*win-x64.zip" | Select-Object -First 1
          if (-not $asset) {
            throw "No Windows zip found in release/"
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --title "Open Hex Assistant $tag" --generate-notes --verify-tag
          }
